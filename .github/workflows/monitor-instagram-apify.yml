name: Instagram投稿の自動監視(Apify)

# 公式サイトAPIが無い6店舗(v40/v20/v18/v21/v34/v35)のInstagram投稿をApify経由で日次チェックし、
# 新着のスケジュール告知らしき投稿があればVisionで抽出して data.js に差分反映する。
# 詳細は tools/monitor-instagram-apify.js のコメント参照。
#
# Apifyは正規の第三者スクレイピングサービス(pay-per-result)で、自社アカウントへのログイン・
# 検知回避は行わない。そのためWaitinglist取込み(import-waitinglist.yml)と違い、確率抽選・
# ランダム遅延・巡回ウィンドウのような複雑な設計は不要で、単純な日次cronにしてある。
#
# スクリプトは「APIFY_API_TOKEN未設定 / Apify呼び出し失敗 / 対象外店舗・過去日エントリの変化」の
# いずれかで data.js / apify-monitor-state.json を書き換えずに非ゼロ終了する。
# その場合このワークフローも失敗させて、異常が Actions の画面で見えるようにする。
#
# data.js / apify-monitor-state.json だけでなく、data.js のスナップショットである
# 店舗静的ページ(venues/)と sitemap.xml も、このワークフローの中で再生成する
# (import-waitinglist.yml と同じ。再生成は `git pull --rebase` の後に行う)。
# 【なぜこのワークフローでも再生成するか】
#   ここで再生成しないと、Instagram由来の日程は次に Waitinglist取込み(翌朝06:23 JST)が走るまで
#   約23時間 venues/ に反映されず、JSを実行しないクローラに古い日程が見え続ける。しかも
#   翌朝それを拾うのは Waitinglist のジョブなので、Instagram由来の6店ぶんのページ更新が
#   「chore: Waitinglistから日程を自動取得」という【事実と違うコミットメッセージ】で記録される
#   (障害調査で人を惑わせる)。
#
# 日付書式などの data.js の検査は、両ワークフロー共通の tools/validate-data.js が持つ。
# この監視は LLM(Vision)が読み取った日付をそのまま入れる経路なので、
# `2026-9-5` / `9/5` / `2026-07-01T00:00:00Z` のような値を持ち込みやすい。
# その手の値は本番サイトの並び順を壊し、静的ページの再生成(=翌朝のジョブ)も落とすため、
# コミット前にここで止める。
#
# ============================================================
# 【実行モード】手動実行は既定 dry-run / 定期実行は無条件で本番
# ============================================================
# 本番実行は【不可逆】である。tools/monitor-instagram-apify.js は
# 「確認済み投稿日時(apify-monitor-state.json の lastPostedAt)」を、採用できた件数に関係なく
# その店で確認できた最新投稿まで無条件に前進させる。したがって Vision が読めなかった投稿・
# 検査で捨てられた行は「次回に持ち越し」ではなく【自動経路から永久に失われる】。
# とくに状態ファイルが空の初回実行は、6店 × 直近12投稿のバックログ全体を一度きりで消費する。
#
# 一方 --dry-run は data.js への書き込みと状態ファイルの保存の【両方より前に return】するので、
# 取得と抽出だけ行い、バックログを1件も消費しない(=何度でもやり直せる)。
# そこで【手動実行(workflow_dispatch)の既定を dry-run】にし、本番反映は
# 入力 dry_run のチェックを外したときだけ行う。「うっかり dry-run」は何も起きずやり直せるが、
# 「うっかり本番」は取り返しがつかないため。
#
# ★【定期実行(schedule)は入力を一切参照せず、無条件で本番実行する】★
#   schedule には inputs が渡らない(github.event.inputs.* は空文字)。もし判定を
#   「明示的に false でなければ dry-run」という形にすると【毎朝の定期実行が永久に dry-run になる】。
#   その場合 Actions は毎日グリーンのまま data.js が1バイトも更新されず、【誰も気づけない】。
#   これは「誤って本番を走らせる」より悪い。本番の誤実行は不可逆だが【見える】のに対し、
#   dry-run の固着は可逆だが【見えない】からである。
#   そのため判定は「イベント種別で先に分岐し、workflow_dispatch のときだけ入力を読む」形にしてある
#   (下の「実行モードを判定する」ステップ)。この構造は変えないこと。
#
#   【固着に気づく方法(毎日効く順)】
#     1. 判定ステップのログ先頭と注記が「実行モード: DRY-RUN」になる。定期実行なのにこう出ていたら固着。
#     2. コミットステップが Actions の画面で【skipped】表示になる(本番なら必ず実行される)。
#        この2つは毎回・確実に出るので、固着の一次検知はこちらで行う。
#     3. 「確認済み投稿日時が前進したかを確認」ステップが件数を出す。ただし ::warning:: が出るのは
#        状態ファイルが空(記録0店)のときだけで、【初回の本番実行が成功すると以後この警告は鳴らない】。
#        2日目以降に固着した場合の表示は「前進したか: いいえ」で、新着0件の平常日と見分けが付かない。
#        この項目は補助であって主防御ではない(初回の空振りを拾うのが役目)。
#
# 【型の落とし穴】入力を `type: boolean` にして、型付きの inputs コンテキストで
#   `inputs.dry_run == 'true'` と比較してはいけない。GitHubの式は型が違う値を比較すると数値に
#   変換するため、boolean の true と文字列 'true' の比較は false になる
#   (= dry-run 指定が無視されて本番が走る。公式の式エンジンで実測済み)。
#   ここでは github.event.inputs.*(type: boolean でも【常に文字列】)をenv経由でシェルに渡し、
#   文字列として判定している。型付きで書くなら `inputs.dry_run` / `inputs.dry_run == true` /
#   `fromJSON(github.event.inputs.dry_run)` が正しい形。
#
# ★【2026-07-31時点、このワークフローの定期実行は無効(disabled_manually)にしてある】★
#   `gh workflow disable` で止めた。理由は、状態ファイルが {} の(=6店ぶんのバックログが
#   まるごと残っている)状態で誰も見ていない早朝に初回の本番実行が走ると、上記のとおり
#   バックログ全体が一度きり・不可逆に消費されてしまうため。
#   【このPRがマージされても定期実行は無効のまま】である。
#
#   ▼ 初回の観測から有効化までの手順(この順序でしか実行できない)
#     ★【無効化中は workflow_dispatch も 422 で弾かれる】★
#       "Cannot trigger a 'workflow_dispatch' on a disabled workflow"(実測)。
#       しかもこの判定は ref の検証より前に効く。つまり【手動 dry-run のために有効化は避けて通れず、
#       有効化した瞬間に毎朝07:10 JSTのcron(=無条件で本番・不可逆)も同時に再武装する】。
#       そのため「まず dry-run で観測してから有効化する」という順序は【実行不能】。
#       有効化してから dry-run を回し、【判断を待たずにその場で無効化に戻す】こと。
#
#     下のコマンドは1回のコピペで「有効化 → dry-run実行 → 完了待ち → 無効化」まで行う。
#     【このブロックごと貼ること】。手で enable / run / disable と分けて叩くと最後が抜ける。
#
#       bash -c '
#       WF=.github/workflows/monitor-instagram-apify.yml
#       cleanup() {
#         trap - EXIT INT TERM HUP
#         echo ""
#         echo "--- 無効化に戻します ---"
#         gh workflow disable "$WF" || echo "(disable が失敗しました。すでに無効なら正常。下の状態表示で確認すること)"
#         gh workflow list --all | grep -i instagram || true
#       }
#       on_signal() { cleanup; exit 130; }
#       trap cleanup EXIT
#       trap on_signal INT TERM HUP
#       gh workflow enable "$WF" || exit 1
#       gh workflow run "$WF"
#       sleep 15
#       gh run watch "$(gh run list --workflow="$WF" --event workflow_dispatch --limit 1 --json databaseId --jq ".[0].databaseId")" --exit-status
#       '
#
#     【なぜ trap か】`;` でつなぐ形は「前段のコマンドが失敗しても disable する」は守るが、
#       【Ctrl-C や端末を閉じた場合には disable に到達しない】。中断は失敗ではないため。
#       そこを通り抜けると workflow が有効のまま残り、次の07:10 JSTに無条件・本番・無人の実行が走る。
#       trap で EXIT/INT/TERM/HUP を捕まえれば、正常終了・エラー・Ctrl-C・端末クローズの
#       すべてで無効化に戻る(4経路とも実測済み。いずれも disable の呼び出しは1回)。
#     【なぜ bash -c で包むか】対話シェルにそのまま貼ると EXIT トラップは【シェルを閉じるまで】
#       発火しない。サブシェルに閉じ込めることで、このコマンドの終わりが trap の発火点になる。
#     ★【bash -c を外さないこと】外して本文だけを対話シェルに貼ると、【正常終了しても
#       EXIT トラップが発火せず disable が呼ばれないまま workflow が有効で残る】(zsh/bash とも実測)。
#       このとき `--- 無効化に戻します ---` の行も状態表示も【出ない】ので、
#       ★その2行が出なかったら有効のまま残っていると判断し、`gh workflow disable "$WF"` を
#       手で叩くこと★(「出るはずのものが出ない」を検知の合図にする)。
#     【trap - による再入防止は bash 固有の挙動に依存している】zsh でスクリプトとして同じ本文を
#       実行すると、関数内の `trap - EXIT` が EXIT トラップを解除しきらず disable が2回走る
#       (結果は無効化で安全だが403のノイズが出る)。bash -c を別のシェルに変えないこと。
#     【cleanup 冒頭の `trap -` は必須】gh workflow disable は冪等でなく、すでに無効な状態で
#       もう一度叩くと 403 で赤くなる。シグナル経路(on_signal→cleanup)の後に EXIT トラップが
#       再度走ると二重に disable してしまうため、cleanup の先頭で自分自身を解除している。
#       手順の外で追加の `gh workflow disable` を叩いた場合も同じ理由で403になる(無効という結果は同じ)。
#     【最後に必ず状態を表示する】表示が `disabled_manually` でなければ、有効のまま残っている。
#       その場合は手で `gh workflow disable "$WF"` を叩くこと(放置すると翌朝に本番実行が走る)。
#
#     1. 上のブロックを貼って実行する(入力は既定=dry_run ON のまま。--field は付けない)
#        ・端末(TTY)から実行すると `gh workflow run` が dry_run の値を対話で聞いてくる。
#          既定の true がプリフィルされているので【そのまま Enter】でよい。
#          非TTY(スクリプト経由など)ではプロンプトは出ず、既定の dry-run で実行される。
#        ・`gh run list` の `--event workflow_dispatch` は【外さないこと】。付けないと
#          sleep 15 以内に新しいrunが現れなかったとき、直前の schedule のrun(過去の失敗)を掴んで
#          「dry-runが失敗した」と誤読する。
#     2. runのログ先頭が【実行モード: DRY-RUN】であることを必ず目視で確認してから内訳を読む
#        (ここが「本番」なら即座に止めること。バックログを消費している)
#     3. 6店ぶんの Vision出力(採用/正規化/破棄の内訳と破棄理由の分布)を読み、較正を判断する
#     4. 判断が終わっていなくても、この時点で既に無効化に戻っている(上の trap)。
#        次の07:10 JSTを跨ぐ可能性がある限り、有効化したまま放置しないこと
#     5. 較正OKと判断できたら改めて `gh workflow enable "$WF"` で有効化し、
#        ここに【いつ・誰が有効化したか】を追記する(以後は毎朝の定期実行が本番で走る)

on:
  schedule:
    # cronはUTC。22:10 UTC = 07:10 JST(毎日1回。Waitinglist取込み(06:23 JST)の後にずらしてある)
    # 【この経路は入力を一切参照せず、常に本番実行】(上の「実行モード」参照)
    - cron: '10 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          dry-run(書き込みなし)で実行する。ONのままなら Apify取得とVision抽出だけ行い、
          data.js / apify-monitor-state.json / venues/ を一切書き換えない(コミット・pushもしない。
          確認済み投稿日時も進まないので何度でもやり直せる)。本番反映したいときだけOFFにする
          【OFFは不可逆】— その回で拾えなかった投稿は自動経路では二度と処理されない。
        type: boolean
        required: false
        default: true

permissions:
  contents: write

# 同時実行を防ぐ(手動実行とcronが重なって競合するのを避ける)
concurrency:
  group: monitor-instagram-apify
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # 【ハングを何時間も垂れ流さないための上限】GitHub Actions の既定は360分で、
    # 何かが固まったときに6時間気づけない。実測では 6店 × 直近12投稿の初回バックログでも
    # 全体約10分(Vision呼び出し27回)、Vision の max_tokens を上げた後の見積りでも20〜40分。
    # 【2026-08-01に60→90分へ】Apifyの取得タイムアウトを60秒→180秒にし、リトライを1回
    # 入れたため、最悪ケースが 6店 × 180秒 × 2回 = 36分 に増えた。Vision(20〜40分)と
    # 合わせると60分では足りない可能性がある。正常時は従来どおり10〜25分で終わる。
    #
    # 【この上限はジョブ全体のもの】Apify取得・画像ダウンロード・Vision抽出に加え、
    # git pull --rebase / gen-venue-pages / gen-sitemap の再生成も同じジョブに乗る。
    # Vision 1回あたりの無音上限(tools/venue-schedule-vision.js の STREAM_IDLE_TIMEOUT_MS)
    # だけを見て全体の所要時間を推し量らないこと。
    timeout-minutes: 90
    steps:
      # 【このジョブが dry-run になる条件はこの1箇所だけで決まる】後続ステップは
      # steps.mode.outputs.dry_run を見るだけで、イベント種別も入力も自分では解釈しない。
      #
      #   イベントが workflow_dispatch 以外(schedule / API の workflow run 等)
      #     … 入力を【一切参照せず】 dry_run=false(=従来どおり本番)。
      #       ここで入力を見に行くと、空文字を dry-run と解釈して定期実行が永久に空回りする
      #       (ヘッダの「定期実行は入力を一切参照せず」参照)。
      #   イベントが workflow_dispatch
      #     … 入力が【明示的に false のときだけ】本番。既定(true)・空・想定外の値はすべて dry-run。
      #       手動実行では想定外の入力に出くわしたら安全側(何も書かない)に落とす。
      #
      # ★ログの先頭でモードが分かるよう、チェックアウトより前に置いてある。
      #   Actions の実行サマリからも判別できるよう、注記(::notice:: / ::warning::)と
      #   ジョブサマリ($GITHUB_STEP_SUMMARY)の両方に出す。
      - name: 実行モードを判定する(手動実行の既定は dry-run / 定期実行は本番)
        id: mode
        env:
          # 入力値を run: のシェルに ${{ }} で直接埋め込まない(値がそのままコマンドとして
          # 解釈される経路を作らない)。github.event.inputs.* は type: boolean でも
          # 常に文字列("true"/"false"、未指定なら空)なので、シェルでは文字列として比較する。
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_DRY_RUN" = "false" ]; then
              dry_run=false
            else
              dry_run=true
            fi
          else
            # schedule など: 入力は参照しない。常に本番。
            dry_run=false
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "イベント=$EVENT_NAME / 入力dry_run=${INPUT_DRY_RUN:-(なし)} / 判定=$dry_run"
          if [ "$dry_run" = "true" ]; then
            echo "=================================================="
            echo " 実行モード: DRY-RUN(書き込みなし・コミットなし)"
            echo "=================================================="
            echo "::notice title=実行モード DRY-RUN::data.js / apify-monitor-state.json / venues/ は書き換えず、コミット・pushも行いません。確認済み投稿日時(lastPostedAt)も前進しないため、同じ投稿を後からもう一度処理できます。"
            {
              echo "# 実行モード: DRY-RUN(書き込みなし)"
              echo ""
              echo "\`node tools/monitor-instagram-apify.js --dry-run\` で実行します(イベント: \`$EVENT_NAME\`)。"
              echo ""
              echo "- \`data.js\` / \`apify-monitor-state.json\` / \`venues/\` は書き換えず、**コミット・pushも行いません**。"
              echo "- **確認済み投稿日時(lastPostedAt)は前進しません**。取りこぼしても後からやり直せます。"
              echo "- 抽出・正規化・破棄の内訳は「Instagram新着投稿を…」ステップのログを見てください"
              echo "  (dry-run では状態ファイルを書かないので \`lastExtraction\` には残りません)。"
              echo "- 本番反映するときは Run workflow の **dry_run のチェックを外して** 再実行してください。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=================================================="
            echo " 実行モード: 本番(差分があればコミット&プッシュ)"
            echo "=================================================="
            # 【注記の使い分け】定期実行の本番は「毎日の正常運転」なので ::notice::。
            # ここを ::warning:: にすると成功した緑のrunにも毎回黄色が付き、
            # 「warningが出ている = 見るべきもの」という読み方ができなくなる(固着警告も埋もれる)。
            # 一方、手動でチェックを外した本番は【人が不可逆な操作をわざわざ選んだ回】なので
            # ::warning:: で目立たせる(毎日は起きない)。
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::warning title=手動での本番実行::dry_run のチェックが外れています。data.js / apify-monitor-state.json を更新し、差分があればコミット&pushします。確認済み投稿日時が前進するため、この回で拾えなかった投稿は自動経路では二度と処理されません(不可逆)。"
            else
              echo "::notice title=実行モード 本番(定期実行)::data.js / apify-monitor-state.json を更新し、差分があればコミット&pushします。確認済み投稿日時が前進します(不可逆)。"
            fi
            {
              echo "# 実行モード: 本番(コミット&プッシュあり)"
              echo ""
              echo "\`node tools/monitor-instagram-apify.js\` で実行します(イベント: \`$EVENT_NAME\`)。"
              echo ""
              echo "- 差分があれば \`data.js\` / \`apify-monitor-state.json\` / \`venues/\` をコミット&pushします。"
              echo "- **確認済み投稿日時(lastPostedAt)が前進します**。この回で採用できなかった投稿は"
              echo "  自動経路では二度と処理されません(不可逆)。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          # 既定の浅いクローン(fetch-depth: 1)だと、下の `git pull --rebase` が
          # マージベースを解決できずに失敗することがある(checkout〜push の間に main が進んだ日)。
          # 履歴を全部取っておけばこの落とし穴は塞げる(import-waitinglist.yml と同じ)。
          fetch-depth: 0

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # dry-run では --dry-run を付けて呼ぶ。スクリプトは data.js の書き込みと
      # 状態ファイルの保存の【両方より前に return】するので、バックログを1件も消費しない。
      #
      # 【ここだけは = "true" のまま(下の2ステップの != 'false' / == 'false' と非対称)】
      #   判定ステップが壊れて空になった場合、ここを dry-run 側に倒すと
      #   「緑のまま何も書かれない」= 見えない失敗になる。書き込ませておけば直後の
      #   「書き込みが起きていないことを確認」が作業ツリーの変化を検知して【ジョブが赤くなる】。
      #   その回はコミットステップに到達しないので、push は起きない(赤いが安全)。
      - name: Instagram新着投稿をApifyで取得し、スケジュール告知をdata.jsに反映
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          # 【出力を握って STEP SUMMARY にも載せる】
          # dry-run は状態ファイルを書かないので、投稿・行の内訳(lastExtraction)がディスクに残らない。
          # dry-run の判断材料はログだけなので、全店合計のブロックだけはジョブサマリにも出して
          # 「Actionsの画面を開けば分かる」状態にする(生ログを開かないと読めない、をやめる)。
          # tee でそのまま標準出力にも流すため、::error:: / ::warning:: の注記は従来どおり機能する。
          # 【終了コード 2 = 一部の店の取得に失敗(書き込みは完了)】
          # 0=全店成功 / 1=何も書いていない / 2=一部失敗。2 でもジョブは赤くするが、
          # 成功した店のデータはコミットしたいので、後続ステップは走らせる必要がある。
          # そこで一旦 rc を控え、コミット後に最終ステップで非ゼロ終了させる。
          set -o pipefail
          rc=0
          if [ "$DRY_RUN" = "true" ]; then
            node tools/monitor-instagram-apify.js --dry-run | tee /tmp/monitor-output.txt || rc=$?
          else
            node tools/monitor-instagram-apify.js | tee /tmp/monitor-output.txt || rc=$?
          fi

          # rc=1(何も書いていない)はここで即座に落とす。rc=2 は書き込み済みなので後続へ進む。
          if [ "$rc" = "1" ]; then
            echo "::error title=Instagram監視 - 中止::data.js / 状態ファイルは書き換えていません。"
            exit 1
          fi
          echo "$rc" > /tmp/monitor-rc.txt

          # 「=== 全店合計 ===」からその段落の終わり(空行)までを抜き出す。
          # 見つからない場合でもジョブは落とさない(集計の抜き出しは補助であって本質ではない)。
          {
            echo ""
            echo "## 取り込み結果(全店合計)"
            echo ""
            if grep -q '=== 全店合計 ===' /tmp/monitor-output.txt; then
              echo '```'
              sed -n '/=== 全店合計 ===/,/^$/p' /tmp/monitor-output.txt
              echo '```'
            else
              echo "(合計行が見つかりませんでした。上のステップのログを直接確認してください)"
            fi
            echo ""
            echo "**「失われた」件数が0でない場合**、その投稿の内容はサイトに一切入らず、"
            echo "確認済み投稿日時が進むため自動経路では二度と処理されません。"
            echo "\`node tools/import-venue-image.js --venue <id> --instagram-url <投稿URL>\` で手動取込みしてください。"
          } >> "$GITHUB_STEP_SUMMARY"

          # 【採用行の明細もサマリに出す】公開前の全件照合(手順⑤)は、増える行を1件ずつ
          # 元の投稿画像と突き合わせる作業。dry-run は data.js を書かないので、ここに出しておかないと
          # 生ログを開かない限り照合できない。出るのは日付・開始時刻・大会名・参加費・permalink、
          # つまり data.js に載せてサイトで公開する内容そのもので、公開範囲は増えない
          # (キーワード不一致ログの「キャプション本文」とは性質が正反対。あちらは出さない)。
          {
            echo ""
            echo "## 追加される行の明細(公開前の全件照合用)"
            echo ""
            if grep -q '=== 追加される行の明細' /tmp/monitor-output.txt; then
              echo '```'
              sed -n '/=== 追加される行の明細/,/=== 全店合計 ===/p' /tmp/monitor-output.txt | sed '$d'
              echo '```'
            else
              echo "(明細が見つかりませんでした。上のステップのログを直接確認してください)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 壊れた data.js をコミットして本番サイトを白画面にしないための最終ゲート。
      # 構文・件数・id重複・【日付書式(YYYY-MM-DD ゼロ埋め)】を見る。中身は tools/validate-data.js
      # (import-waitinglist.yml と同じものを呼ぶ。検査を2箇所に書くと必ず片方だけ古くなるため)。
      #
      # ★このステップが落ちたら、まず data.js の【日付書式】と【id重複】を疑うこと。
      #   Vision抽出が返した値は tools/monitor-instagram-apify.js 側(層2)で1行ずつ検査して
      #   不正な行を捨てているので、ここまで届いたということは層2に穴がある。
      #   エラーには【実際の不正値】と venueId / id / name が出る。ただしこの経路で落ちた行は
      #   リポジトリの data.js には入っていない(コミットされずに破棄される)ので、
      #   直す対象は data.js ではなく取込み側。ここで落ちた回は data.js を1バイトも push しない。
      - name: 出力の妥当性を確認(日付書式を含む)
        run: |
          node tools/validate-data.js .
          node -e 'JSON.parse(require("fs").readFileSync("apify-monitor-state.json","utf8"))'

      # 【dry-run の二重の安全・その1】--dry-run は1バイトも書かないはずなので、それを実測で確かめる。
      # ここが落ちるのは「dry-run が書き込んだ」= スクリプト側の退行なので、ジョブを赤くして知らせる。
      # このステップが失敗しても下のコミットステップは if で丸ごとスキップされるため、
      # 書き換わった内容がコミット・pushされることはない(落ちたときの作業ツリーは捨てられる)。
      #
      # 【条件が == 'true' ではなく != 'false' な理由】判定ステップが壊れて出力が空になった場合
      # (id の削除・出力名の改名など)、取込みは --dry-run なしで走って作業ツリーを書き換える。
      # そのときこのステップも走らせておけば【ジョブが赤くなって気づける】。
      # == 'true' だと素通りして「緑のまま何もpushされない」= 見えない失敗になる。
      - name: 書き込みが起きていないことを確認(本番以外)
        if: steps.mode.outputs.dry_run != 'false'
        run: |
          if test -n "$(git status --porcelain)"; then
            echo "::error title=dry-run なのに作業ツリーが変化::--dry-run では data.js / apify-monitor-state.json / venues/ を1バイトも書き換えないはずです。コミット・pushは行っていません(コミットステップはスキップ済み)。tools/monitor-instagram-apify.js の DRY_RUN 分岐か、実行モード判定ステップの出力(空になっていないか)を確認してください。"
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "作業ツリーに差分なし。dry-run が何も書き換えていないことを確認しました。"
          echo "- dry-run 実行後の作業ツリーに差分が無いことを確認しました(1バイトも書き換わっていません)。" >> "$GITHUB_STEP_SUMMARY"

      # 【状態ファイルの前進を記録する / dry-run固着の補助的な検出】
      # 本番実行のたびに「確認済み投稿日時が前進したか」と「何店ぶん記録があるか」を実行サマリに残す。
      # ★この ::warning:: は【状態ファイルが空(記録0店)のときだけ】鳴る。初回の本番実行が成功すると
      #   以後は鳴らないので、これは固着の主防御ではない(初回の空振りを拾うのが役目)。
      #   固着の一次検知は「判定ステップが DRY-RUN と出す」「コミットステップが skipped 表示になる」の2つ
      #   (ヘッダの【固着に気づく方法】参照)。
      - name: 確認済み投稿日時が前進したかを確認(本番のみ)
        if: steps.mode.outputs.dry_run == 'false'
        run: |
          stores=$(node -e 'const s=JSON.parse(require("fs").readFileSync("apify-monitor-state.json","utf8"));console.log(Object.keys(s).length)')
          if git diff --quiet -- apify-monitor-state.json; then
            advanced="いいえ(新着なし、または全店で取得0件)"
          else
            advanced="はい"
          fi
          echo "確認済み投稿日時の記録がある店舗数: $stores / この実行で前進したか: $advanced"
          {
            echo ""
            echo "## 確認済み投稿日時(apify-monitor-state.json)"
            echo ""
            echo "- 記録がある店舗数: **$stores**"
            echo "- この実行で前進したか: **$advanced**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$stores" = "0" ]; then
            echo "::warning title=状態ファイルが空のままです::本番実行なのに apify-monitor-state.json に1店も記録されていません。全店で新着0件だったか、【dry-run固着】(本番のはずが --dry-run で走っている)を疑ってください。緑のrunが続いているのに {} のままなら後者です。"
          fi

      # 【判定は「明示的に false のときだけ本番」で統一する】このステップに入ってよいのは
      # dry_run が文字列 'false' のときだけ。!= 'true' にすると、判定ステップが壊れて出力が
      # 空になった場合(id の削除・出力名の改名など)に【空文字が本番側に倒れて】
      # コミット・pushまで進んでしまう。空・想定外の値は入口(入力の解釈)と同じく安全側に落とす。
      - name: 差分があればコミット & プッシュ
        if: steps.mode.outputs.dry_run == 'false'
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          # 【dry-run の二重の安全・その2】上の if が将来の編集で壊れても、
          # 'false' 以外(dry-run・空・想定外の値)ならここで必ず止まる(git に触る前に落とす)。
          if [ "$DRY_RUN" != "false" ]; then
            echo "::error title=本番ではないのにコミットステップに到達::実行モードの判定が 'false' 以外(dry-run または空)です。ワークフローの条件設定に不具合があります。コミット・pushは行いません。"
            exit 1
          fi
          # 追加が git add -A なので、判定も未追跡ファイルを含む git status --porcelain で見る。
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          committed=0
          if test -n "$(git status --porcelain)"; then
            git add -A
            git commit -m "chore: Instagram新着投稿(Apify)からスケジュールを自動取得 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
            committed=1
          else
            echo "取込みによる差分なし。"
          fi
          # checkout から push までの間に main が進むと push が弾かれるため、push直前にrebaseして取り込む。
          git pull --rebase
          # rebase で自分のコミットが【空になって消える】ことがある(同じ変更を他のジョブや人が
          # 先に push していた場合。git rebase は空になったコミットを既定で捨てる)。
          # committed=1 のままだと、下の `git commit --amend` が【他人のコミット】を書き換えてしまい、
          # push が non-fast-forward で拒否される。remote は無傷だがログからは真因が読み取れないので、
          # rebase の後に「自分のコミットがまだ残っているか」を実測で取り直す。
          if test "$(git rev-list --count "@{u}..HEAD")" = "0"; then
            echo "rebase で自分のコミットが空になりました(同じ変更が既に main にあります)。amendは行いません。"
            committed=0
          fi
          # 【順序が重要】静的ページの再生成と検査は rebase の"後"に行う。
          #   rebase の前に生成すると、rebase で取り込んだ他ジョブ・人のコミットぶんの data.js が
          #   生成物に反映されず、【push されるツリーが --check を通らない状態】になり得る
          #   (例: Waitinglist取込みが同日に v3 の日程を足していると、その店のページが古いまま押される)。
          #   生成物をコミットに含めないまま rebase することで、venues/*.html の衝突も避けられる。
          node tools/validate-data.js .
          node tools/gen-venue-pages.js .
          node tools/gen-venue-pages.js . --check
          if test -n "$(git status --porcelain)"; then
            git add -A
            if test "$committed" = "1"; then
              # 取込みと同じ1コミットにまとめる(data.js と生成物が別コミットに割れないように)
              git commit --amend --no-edit
            else
              # 取込みに差分が無いのに生成物がズレている = 人が data.js を触って再生成を忘れた状態。
              # 直すのは正しいが、取込みの手柄にすると監査ログが嘘になるので別のメッセージにする。
              git commit -m "chore: 静的ページを data.js に追随させる(自動再生成) ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
              committed=1
            fi
          fi
          if test "$committed" = "0"; then
            echo "差分なし。プッシュしません。"
            exit 0
          fi
          git push

      # 【rc=2 の反映】一部の店の取得に失敗した回は、コミット・pushまで終わらせたうえで
      # 最後にジョブを赤くする。ここより前で落とすと、成功した店のデータが残らない。
      # `if: always()` にはしない — 前段が別の理由で失敗したときは、その失敗をそのまま見せる。
      - name: 一部の店の取得に失敗していたらジョブを失敗にする
        run: |
          rc=$(cat /tmp/monitor-rc.txt 2>/dev/null || echo 0)
          if [ "$rc" = "2" ]; then
            echo "::error title=Instagram監視 - 一部の店を取得できませんでした::取得できた店のデータは反映済みです。失敗した店の確認済み投稿日時は前進していないので、次回の実行でやり直せます。上のログの「取得に失敗した店」を確認してください。"
            exit 2
          fi
          echo "全店の取得に成功しました。"
