name: Waitinglist 日程の自動取得

# Waitinglist(DMMポーカー)の公開APIから対象店舗のトーナメント日程を取得し、
# 差分があるときだけ data.js をコミットする。詳細は tools/import-waitinglist.js のコメント参照。
#
# スクリプトは「取得失敗 / HTTP 200以外 / 対象店舗0件 / ページング不整合 / 別店舗の混入 /
# 今日以降の件数の急減」のとき、その店舗のデータを書き換えない。
# その場合このワークフローも失敗させて、異常が Actions の画面で見えるようにする。
#
# ★【失敗の隔離は店舗単位】1店が失敗しても他店は通常どおり取り込み、コミット・pushまで進む。
#   ジョブは最後に赤くなる。したがって【赤い = 全部止まった】ではない。
#   どの店が失敗したかは取得ステップの ::error:: 注記が実行サマリの先頭に出す。
#   以前は「全店そろって成功しなければ1文字も書かない」だったため、たとえば月初に
#   1店が0件を返すだけで正常な他店の取込まで丸ごと止まっていた(変更の理由は
#   tools/import-waitinglist.js のヘッダ【失敗の隔離は店舗単位】を参照)。
#
# ★【月初にこのジョブが赤くなったときは「0件」を疑う。急減ではない】
#   APIは【当月1日以降のレコードしか返さない】。対象店が翌月ぶんをまだ登録していない朝は
#   totalRecords=0 になり「トーナメントが0件でした」でその店だけスキップされる。
#   店が潰れたわけではなく、多くは数日中に登録されて自然に復旧する(v19 は同一シリーズ
#   5回ぶんを約5週おきにまとめ登録する運用で、常時25日前後の残量しか持たない)。
#   このとき他店は通常どおり取り込まれ、その内容は push される(上記の隔離)。
#   急減ガード(前回の半分未満)は【日が過ぎるだけでは発火しない】。前回件数と今回件数は
#   同じ基準日で数えるので両方が同時に減るため。鳴るのは店が未来の大会を取り消したときだけ。
#
# data.js だけでなく、そのスナップショットである店舗静的ページ(venues/)と sitemap.xml も
# このワークフローの中で再生成する。再生成しないと、JSを実行しないクローラに古い日程が見え続ける
# (閲覧者にはブラウザ側の描き直しで最新が出るため、画面を見ても気づけない)。
# 再生成は【`git pull --rebase` の後】に行う。理由は下のコミットステップのコメント参照
# (rebase で取り込んだ他ジョブぶんが生成物に反映されないまま push されるのを防ぐため)。
#
# data.js を書く経路は他にもある(Instagram監視 monitor-instagram-apify.yml)。
# 日付書式のような「どちらが原因でも本番と翌朝のジョブを壊す」検査は、
# 両方のワークフローが同じ tools/validate-data.js を呼ぶ共通の栓にしてある。
#
# 再生成の波及は tools/venue-schedule.js の venueRange() が店舗別なので、
# 取込対象の店(現在は v3 と v19)のページにしか及ばない。日次で書き換わるのは data.js と
# venues/m-holdem-nakasu/index.html・venues/casino-arrows-kokura/index.html の最大3ファイルで、
# 他店のページ・sitemap.xml は動かない
# (以前は全店共通の日付範囲だったため、1件の増減で35ページ全部が書き換わっていた)。
# 対象店を増やすとこの数も増えるので、STORES を触ったらここも直すこと。
#
# ただし【定期開催しか無い店(v5/v41)のページだけは構造的な保証ではない】。
# この2店の焼き込み期間はサイト全体の最古月から決まるため、そこが動けば一緒に動く。
# 実際に動かないのは「この取込が今日以降しか作らず、過去日のエントリに一切触れない」
# という別の性質に依存しているだけ。取込の仕様を変えるときはここも見直すこと
# (詳しくは tools/venue-schedule.js の recurringOnlyRange のコメント)。

on:
  schedule:
    # cronはUTC。21:23 UTC = 06:23 JST(毎日1回)
    - cron: '23 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 同時実行を防ぐ(手動実行とcronが重なって競合するのを避ける)
concurrency:
  group: import-waitinglist
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          # 既定の浅いクローン(fetch-depth: 1)だと、下の `git pull --rebase` が
          # マージベースを解決できずに失敗することがある(checkout〜push の間に main が進んだ日)。
          # 履歴を全部取っておけばこの落とし穴は塞げる。
          fetch-depth: 0

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 終了コードの意味(tools/import-waitinglist.js のヘッダ参照):
      #   0 … 全店成功
      #   2 … 一部の店だけ失敗。成功した店のぶんは data.js に書き込み済み
      #   1 … 何も書いていない(全店失敗・致命的なバグ検出)
      #
      # 2 のときに【ここで止めてはいけない】。止めると成功した店のぶんがコミットされず、
      # 「1店の失敗で全店が止まる」という、この隔離で解消したはずの状態に戻る。
      # そこで 2 は素通しして後続のコミット・pushを走らせ、
      # ジョブ全体は最後の「一部店舗の取得に失敗…」ステップで赤くする。
      - name: Waitinglist から日程を取得して data.js を更新
        id: import
        run: |
          set +e
          node tools/import-waitinglist.js
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "0" ] || [ "$rc" = "2" ]; then
            exit 0
          fi
          exit "$rc"

      # 壊れた data.js をコミットして本番サイトを白画面にしないための最終ゲート。
      # 構文・件数・id重複・【日付書式(YYYY-MM-DD ゼロ埋め)】を見る
      # (スクリプト側の安全弁をすり抜けた場合の受け皿)。中身は tools/validate-data.js。
      #
      # ★このステップが落ちたら、まず data.js の【日付書式】を疑うこと。
      #   `2026-9-5` / `9/5` / `2026-07-01T00:00:00Z` のような値が1件でも混ざると落ちる。
      #   犯人はこのワークフローとは限らない。Instagram監視(monitor-instagram-apify.yml)は
      #   LLM(Vision)が読み取った日付を data.js に入れるので、そちら由来のことがある。
      #   エラーには【実際の不正値】(想定外の値: 2026-9-5 のように)と venueId / id / name が出るので、
      #   仮にスタックトレース側の店名が別店を指していても、その値で data.js を検索すれば
      #   該当エントリに辿り着ける。
      - name: 出力の妥当性を確認(日付書式を含む)
        run: node tools/validate-data.js .

      - name: 差分があればコミット & プッシュ
        run: |
          # 追加が git add -A なので、判定も未追跡ファイルを含む git status --porcelain で見る
          # (git diff --quiet だと未追跡ファイルだけの変更を「差分なし」と誤判定する)。
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          committed=0
          if test -n "$(git status --porcelain)"; then
            git add -A
            git commit -m "chore: Waitinglistから日程を自動取得 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
            committed=1
          else
            echo "取込みによる差分なし。"
          fi
          # checkout から push までの間に main が進むと push が弾かれる。
          # 誰も Actions を見ていないと取込みが静かに止まりサイトが古いまま残るので、
          # push の直前に rebase して取り込む(このコミットが持ち込むのは data.js だけなので、
          # 他の作業と行が衝突する可能性は低い。衝突したらジョブを失敗させて人が気づけるようにする)。
          git pull --rebase
          # rebase で自分のコミットが【空になって消える】ことがある(同じ変更を他のジョブや人が
          # 先に push していた場合。git rebase は空になったコミットを既定で捨てる)。
          # committed=1 のままだと、下の `git commit --amend` が【他人のコミット】を書き換えてしまい、
          # push が non-fast-forward で拒否される。remote は無傷だがログからは真因が読み取れないので、
          # rebase の後に「自分のコミットがまだ残っているか」を実測で取り直す。
          if test "$(git rev-list --count "@{u}..HEAD")" = "0"; then
            echo "rebase で自分のコミットが空になりました(同じ変更が既に main にあります)。amendは行いません。"
            committed=0
          fi
          # 【順序が重要】静的ページの再生成と検査は rebase の"後"に行う。
          #   rebase の前に生成すると、rebase で取り込んだ他ジョブ・人のコミットぶんの data.js が
          #   生成物に反映されず、【push されるツリーが --check を通らない状態】になり得る
          #   (例: Instagram監視が同日に6店ぶんの日程を足していると、その6店のページが古いまま押される)。
          #   生成物をコミットに含めないまま rebase することで、venues/*.html の衝突も避けられる。
          # 再検査(validate-data)も rebase 後にやる。押す物そのものを検査するため。
          node tools/validate-data.js .
          # --check は「生成物がデータと一致しているか」の検査で、ここが落ちるのは
          # 生成が中途半端に終わった場合(=コミットしてはいけない状態)。
          node tools/gen-venue-pages.js .
          node tools/gen-venue-pages.js . --check
          # エリアページ(/areas/<slug>/)も日程を静的に焼き込んでいるので、店舗ページと同じく
          # 取込みのたびに再生成する。忘れるとクローラが見る静的HTMLだけが古いまま残る
          # (閲覧者にはブラウザ側の描き直しで最新が出るため、画面を見ても気づけない)。
          node tools/gen-area-pages.js .
          node tools/gen-area-pages.js . --check
          if test -n "$(git status --porcelain)"; then
            git add -A
            if test "$committed" = "1"; then
              # 取込みと同じ1コミットにまとめる(data.js と生成物が別コミットに割れないように)
              git commit --amend --no-edit
            else
              # 取込みに差分が無いのに生成物がズレている = 人が data.js を触って再生成を忘れた状態。
              # 直すのは正しいが、取込みの手柄にすると監査ログが嘘になるので別のメッセージにする。
              git commit -m "chore: 静的ページを data.js に追随させる(自動再生成) ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
              committed=1
            fi
          fi
          if test "$committed" = "0"; then
            echo "差分なし。プッシュしません。"
            exit 0
          fi
          git push

      # 一部店舗の取得に失敗していた場合、成功したぶんのコミット・pushが終わってから
      # ジョブを赤くする。ここまで来ているので【成功した店のデータは本番に出ている】。
      # 当番がやることは「失敗した店だけ」を調べること(どの店かは取得ステップの
      # ::error:: 注記が実行サマリの先頭に出している)。
      # 月初に落ちた場合は 0件(APIが当月1日以降しか返さない)を最初に疑う。
      - name: 一部店舗の取得に失敗していたらジョブを失敗させる
        if: steps.import.outputs.rc == '2'
        run: |
          echo "::error::一部店舗の取得に失敗しました(成功した店のぶんは反映済み)。失敗した店舗名は取得ステップのエラー注記に出ています。"
          exit 1
