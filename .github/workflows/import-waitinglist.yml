name: Waitinglist 日程の自動取得

# Waitinglist(DMMポーカー)の公開APIから対象店舗のトーナメント日程を取得し、
# 差分があるときだけ data.js をコミットする。詳細は tools/import-waitinglist.js のコメント参照。
#
# スクリプトは「取得失敗 / HTTP 200以外 / 対象店舗0件」のとき data.js を書き換えずに非ゼロ終了する。
# その場合このワークフローも失敗させて、異常が Actions の画面で見えるようにする。

on:
  schedule:
    # cronはUTC。21:23 UTC = 06:23 JST(毎日1回)
    - cron: '23 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 同時実行を防ぐ(手動実行とcronが重なって競合するのを避ける)
concurrency:
  group: import-waitinglist
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Waitinglist から日程を取得して data.js を更新
        run: node tools/import-waitinglist.js

      - name: 差分があればコミット & プッシュ
        run: |
          if git diff --quiet; then
            echo "差分なし。コミットしません。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "chore: Waitinglistから日程を自動取得 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git push
