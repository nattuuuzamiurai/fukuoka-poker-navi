<style>

  .lead{color:var(--mut);font-size:.9em;margin-bottom:22px}
  .card{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);box-shadow:var(--sha);padding:22px 20px}
  label{display:block;font-size:.82em;font-weight:700;color:var(--mut);margin:16px 0 6px}

  /* STICKY AD (自社サービス案内。全ページ共通で画面下部に固定表示) */

<body>

<header>
  <div class="hbar">
    <a class="logo" href="index.html"><span class="pip">♠</span>ふくおかポーカーナビ</a>

  </div>
</header>

<main class="wrap">
  <h1>お問い合わせ</h1>
  <p class="lead">掲載内容の誤り・修正依頼、店舗掲載/PR枠のご相談、その他ご質問はこちらのフォームからお送りください。</p>

  <div class="card">
    <form id="contactForm">
      <label>お問い合わせ種別</label>
      <select id="category" name="category">
        <option value="general">一般のお問い合わせ</option>
        <option value="correction">掲載内容の誤り・修正依頼</option>
        <option value="listing">店舗掲載・PR枠のご相談</option>
        <option value="dashboard">経営管理ダッシュボードのご相談</option>
        <option value="other">その他</option>
      </select>

      <label>メールアドレス<span class="req">*</span></label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">

      <label>お問い合わせ内容<span class="req">*</span></label>
      <textarea id="message" name="message" required placeholder="お問い合わせ内容をご記入ください"></textarea>

      <button type="submit" class="btn" id="submitBtn">送信する</button>
      <div class="status" id="formStatus"></div>
    </form>
    <div class="note">
      送信いただいた内容は当サイト運営者にのみ送られます。返信までお時間をいただく場合があります。
    </div>
  </div>
</main>

<footer>
  <div><b style="color:#fff">ふくおかポーカーナビ</b> — 福岡ポーカートーナメント日程アグリゲーター</div>

</footer>

<div class="stickyAd">
  <img src="img/ptl-bulldog.webp" alt="" width="38" height="38">
  <div class="sa-body">
    <div class="sa-title">成績、記録してますか？</div>
    <div class="sa-desc">ポーカートナメ成績表(無料) — buyin・順位・収支を記録</div>
  </div>
  <a class="sa-btn" href="https://poker-tourney-log--family.expo.app" target="_blank" rel="noopener">使ってみる →</a>
</div>

<script>
(function(){
  // Googleフォーム「福岡ポーカーナビお問い合わせ」への送信。
  // フォーム自体はメールアドレス/お問い合わせ内容の2項目構成のため、
  // 種別選択はお問い合わせ内容の先頭に付記する形で送信する。
  const FORM_ACTION = 'https://docs.google.com/forms/d/e/1FAIpQLSc5jkg9LxWNSMbpxeckeL4SXps6vbR1o7tYogOqYqOcLIsgRA/formResponse';
  const ENTRY_EMAIL = 'entry.427973259';
  const ENTRY_MESSAGE = 'entry.1401877361';

  const form = document.getElementById('contactForm');
  const statusEl = document.getElementById('formStatus');
  const btn = document.getElementById('submitBtn');
  const categorySelect = document.getElementById('category');
  const categoryLabels = {
    general: '一般のお問い合わせ',
    correction: '掲載内容の誤り・修正依頼',
    listing: '店舗掲載・PR枠のご相談',
    dashboard: '経営管理ダッシュボードのご相談',
    other: 'その他'
  };

  // URLの ?type=... を見て、#category の既存の選択肢(value)のいずれかと一致すれば
  // それを選択済みにする。一致しない値・パラメータ無しのときは何もしない
  // (先頭の一般のお問い合わせのままにする)。例: guide/partners/index.htmlのPR掲載枠の
  // お問い合わせ導線は contact.html?type=listing、経営管理ダッシュボードの
  // お問い合わせ導線は contact.html?type=dashboard でリンクし、この関数が
  // 対応する選択肢を選択済みにする(index.htmlの掲載店舗募集バナーは2026-09-19以降、
  // 直接ここへはリンクせず guide/partners/ を経由する。listing-banner.js冒頭コメント参照)。
  function pickCategoryFromQuery(requested, validValues) {
    return (requested && validValues.includes(requested)) ? requested : null;
  }
  const requestedType = new URLSearchParams(location.search).get('type');
  const picked = pickCategoryFromQuery(
    requestedType,
    Array.from(categorySelect.options).map(o => o.value)
  );
  if (picked) categorySelect.value = picked;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    statusEl.className = 'status';
    statusEl.textContent = '送信中…';

    const email = document.getElementById('email').value;
    const category = document.getElementById('category').value;
    const message = document.getElementById('message').value;
    const body = new URLSearchParams();
    body.set(ENTRY_EMAIL, email);
    body.set(ENTRY_MESSAGE, `【${categoryLabels[category] || category}】\n${message}`);

    try{
      // Googleフォームはno-cors応答のためレスポンス内容は読めない。
      // fetchが例外を投げなければ送信成功とみなす。
      await fetch(FORM_ACTION, { method: 'POST', mode: 'no-cors', body });
      statusEl.className = 'status ok';
      statusEl.textContent = '送信しました。お問い合わせありがとうございます。';
      form.reset();
    } catch(err){
      statusEl.className = 'status err';
      statusEl.textContent = '送信に失敗しました。時間をおいて再度お試しください。';
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
